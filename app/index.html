<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f2ef" />
    <meta name="description" content="Locus is your private desk for the things you save." />
    <link rel="icon" href="/locus-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/locus-mark-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Locus</title>
    <script>
      try {
        var t = localStorage.getItem("locus-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
